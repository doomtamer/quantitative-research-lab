name: Quantitative Research Lab CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-safety:
    name: Research Safety Guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR merge commit and its parents
        uses: actions/checkout@v6
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check historical research artifacts against the base
        run: python3 scripts/check_research_safety.py --base HEAD^1 --head HEAD

  tests:
    name: Python 3.12 - pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install locked dependencies
        run: uv sync --locked --group dev

      - name: Run unit tests
        run: uv run --locked python -m pytest -q

