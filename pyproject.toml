[project]
name = "quantitative-research-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1", "pandas>=2.2", "scipy>=1.14", "statsmodels>=0.14",
  "scikit-learn>=1.5", "pyarrow>=18", "duckdb>=1.1", "pydantic>=2.9",
  "pyyaml>=6", "matplotlib>=3.9", "jupyterlab>=4.2", "ipykernel>=6.29"
]
[project.optional-dependencies]
agents = ["langgraph>=0.2", "langchain-openai>=0.2", "openai>=1.50"]
dev = ["pytest>=8.3", "ruff>=0.7"]
[tool.uv]
package = true
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
